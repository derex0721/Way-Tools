name: Bug Report
description: Report an operation that failed or behaved unexpectedly.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        **This Issue will be public. English or 繁體中文 is welcome.**
        Do not submit passwords, API keys, secrets, private documents, sensitive Context, payment information or confidential data. / 請勿提交密碼、API keys、秘密、私人文件、敏感脈絡、付款資訊或機密資料。
        Remove passwords, API keys, credentials, private documents, sensitive Context, private URLs and identifying details before submitting.
        Do not attach the private beta package, a complete workspace or raw logs. Use non-sensitive examples and reviewed screenshots.
        If sensitive details are involved, invited testers should use their existing private contact with the owner without sending secrets.
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do? / 我想做的事
      placeholder: Describe the task using a non-sensitive example.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Web or Extension? / 使用方式
      options:
        - Web
        - Chrome Extension — Quick Way
        - Chrome Extension — Full workspace
        - Not sure / 不確定
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, OS and browser/version / 裝置、系統、瀏覽器
      description: Unknown is fine. Do not include device identifiers or private paths.
      placeholder: "Mac, Chrome (version unknown)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 操作步驟
      description: One to three steps with sample data are enough.
      placeholder: |
        1. Open…
        2. Enter sample text…
        3. Choose…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 預期
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 實際
      description: Include only a reviewed, non-sensitive error message.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional) / 截圖（選填）
      description: Attach a reviewed screenshot here. Hide private tabs, names, URLs and content first.
    validations:
      required: false
  - type: dropdown
    id: recovery
    attributes:
      label: Could you recover? / 能否恢復
      options:
        - Yes / 可以
        - No / 不可以
        - Not sure / 不確定
    validations:
      required: true
  - type: textarea
    id: recovery_steps
    attributes:
      label: How did you recover or what did you try? / 怎麼恢復或試過什麼
    validations:
      required: false
  - type: dropdown
    id: blocking
    attributes:
      label: Does it block further use? / 是否阻止繼續使用
      options:
        - Yes / 是
        - No / 否
        - Not sure / 不確定
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / 送出前
      options:
        - label: I reviewed this report and attachments and removed sensitive information. / 已檢查並移除敏感資訊。
          required: true
