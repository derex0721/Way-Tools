name: Feature Request
description: Describe a real use case and the outcome you need.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        **This Issue will be public. English or 繁體中文 is welcome.**
        Do not submit passwords, API keys, secrets, private documents, sensitive Context, payment information or confidential data. / 請勿提交密碼、API keys、秘密、私人文件、敏感脈絡、付款資訊或機密資料。
        Use a made-up or public example. Do not paste passwords, API keys, credentials, private documents, sensitive Context or secrets.
        Do not attach the private beta package, private work materials or a complete workspace.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 想解決的情境
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome / 希望的結果
      description: Describe what you would like to achieve, rather than implementation details.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround / 目前怎麼做
      description: None is an acceptable answer.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Why would it help? / 為什麼有幫助
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / 送出前
      options:
        - label: I reviewed this report and attachments and removed sensitive information. / 已檢查並移除敏感資訊。
          required: true
